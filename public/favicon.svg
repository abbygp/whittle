<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Log body -->
  <ellipse cx="16" cy="16" rx="14" ry="9" fill="#8B5A2B"/>
  <ellipse cx="16" cy="16" rx="14" ry="9" fill="url(#logShade)" opacity="0.35"/>
  <!-- Bark grain lines -->
  <path d="M5 12.5c3.5 1.2 7 1.8 11 1.8s7.5-.6 11-1.8" stroke="#6B4423" stroke-width="1" stroke-linecap="round" opacity="0.55"/>
  <path d="M4.5 16c3.8.9 7.5 1.4 11.5 1.4s7.7-.5 11.5-1.4" stroke="#6B4423" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <path d="M5 19.5c3.5-1 7-1.5 11-1.5s7.5.5 11 1.5" stroke="#6B4423" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <!-- Cut face (left) -->
  <ellipse cx="5" cy="16" rx="3.2" ry="9" fill="#D4A574"/>
  <ellipse cx="5" cy="16" rx="2.2" ry="6.5" fill="#E8C9A0"/>
  <!-- Growth rings -->
  <ellipse cx="5" cy="16" rx="1.5" ry="4.5" stroke="#C4925A" stroke-width="0.7" fill="none"/>
  <ellipse cx="5" cy="16" rx="0.8" ry="2.4" stroke="#C4925A" stroke-width="0.7" fill="none"/>
  <circle cx="5" cy="16" r="0.55" fill="#8B5A2B"/>
  <!-- Cut face (right) -->
  <ellipse cx="27" cy="16" rx="3.2" ry="9" fill="#C4925A"/>
  <ellipse cx="27" cy="16" rx="2.2" ry="6.5" fill="#D4A574"/>
  <ellipse cx="27" cy="16" rx="1.5" ry="4.5" stroke="#A67B4B" stroke-width="0.7" fill="none"/>
  <ellipse cx="27" cy="16" rx="0.8" ry="2.4" stroke="#A67B4B" stroke-width="0.7" fill="none"/>
  <circle cx="27" cy="16" r="0.55" fill="#6B4423"/>
  <defs>
    <linearGradient id="logShade" x1="16" y1="7" x2="16" y2="25" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
</svg>
